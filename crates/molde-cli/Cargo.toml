[package]
name = "molde-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

description = "molde — a Rust schema tool (introspection, migrations, apply)"

[[bin]]
name = "molde"
path = "src/main.rs"

[features]
# sqlx TLS backend. Defaults to rustls; for servers with X.509 v1 certificates
# that rustls rejects, build with:
#   cargo build -p molde-cli --no-default-features --features tls-native-tls
default = ["tls-rustls"]
tls-rustls = ["molde-scaffold/tls-rustls", "molde-migrate/tls-rustls", "molde-sync/tls-rustls"]
tls-native-tls = ["molde-scaffold/tls-native-tls", "molde-migrate/tls-native-tls", "molde-sync/tls-native-tls"]
# Like `tls-native-tls`, but statically links a vendored OpenSSL (built from
# source). Use for portable static (musl) release binaries that must run on any
# Linux — including old glibc — and still talk to servers with legacy X.509 v1
# certificates that rustls rejects.
tls-native-tls-vendored = ["tls-native-tls", "dep:openssl", "openssl/vendored"]

[dependencies]
molde-core = { workspace = true }
molde-providers = { workspace = true }
molde-migrate = { workspace = true }
molde-scaffold = { workspace = true }
molde-design = { workspace = true }
molde-lang = { workspace = true }
molde-sync = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
# Interactive UX: prompts, spinner, and color (with TTY auto-detection).
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
indicatif = "0.17"
console = "0.15"
# Self-update from GitHub releases (`molde update`). Always fetches over rustls
# (GitHub has a modern cert); the asset variant is chosen at build time.
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
# Only used to force a vendored, statically-linked OpenSSL into the build graph
# (via feature unification) for `tls-native-tls-vendored`. Not referenced in code.
openssl = { version = "0.10", optional = true }
