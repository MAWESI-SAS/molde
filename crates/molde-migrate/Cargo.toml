[package]
name = "molde-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

description = "Migration application runtime (sqlx + tiberius) for molde"

[features]
default = ["tls-rustls"]
tls-rustls = ["sqlx/tls-rustls"]
# OpenSSL backend: more tolerant of X.509 v1 certificates (legacy servers).
tls-native-tls = ["sqlx/tls-native-tls"]

[dependencies]
molde-core = { workspace = true }
molde-providers = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net", "sync"] }
# SQL Server (TDS) — outside sqlx's Any driver.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
