[package]
name = "efrust-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

description = "CLI estilo `dotnet ef` implementado en Rust"

[[bin]]
name = "efrust"
path = "src/main.rs"

[features]
# Backend TLS de sqlx. Por defecto rustls; para servidores con certificados
# X.509 v1 que rustls rechaza, compilar con:
#   cargo build -p efrust-cli --no-default-features --features tls-native-tls
default = ["tls-rustls"]
tls-rustls = ["efrust-scaffold/tls-rustls", "efrust-migrate/tls-rustls"]
tls-native-tls = ["efrust-scaffold/tls-native-tls", "efrust-migrate/tls-native-tls"]

[dependencies]
efrust-core = { workspace = true }
efrust-providers = { workspace = true }
efrust-migrate = { workspace = true }
efrust-scaffold = { workspace = true }
efrust-design = { workspace = true }
efrust-lang = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }
