# Two services:
#   app → development container (Rust), where VS Code / Claude lives.
#   db  → local, disposable PostgreSQL for testing scaffolding and migrations.
# SQLite needs no service (it is file-based).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: molde-dev
    volumes:
      # Mount the repo root at the standard devcontainers path.
      - ..:/workspaces/EF_RUST:cached
      # Persistent cargo cache across rebuilds.
      - molde-cargo-cache:/usr/local/cargo/registry
    command: sleep infinity
    environment:
      # Connection string consumed by the molde CLI (sqlx format).
      DATABASE_URL: postgres://molde:molde@db:5432/molde_dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - molde-net

  db:
    image: postgres:17-bookworm
    container_name: molde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: molde
      POSTGRES_PASSWORD: molde
      POSTGRES_DB: molde_dev
    volumes:
      - molde-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molde -d molde_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - molde-net

volumes:
  molde-pgdata:
  molde-cargo-cache:

networks:
  molde-net:
