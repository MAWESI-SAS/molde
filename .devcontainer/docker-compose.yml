# Dos servicios:
#   app → contenedor de desarrollo (Rust), donde vive VS Code / Claude.
#   db  → PostgreSQL local y desechable para probar scaffolding y migraciones.
# SQLite no necesita servicio (es basado en archivo).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: molde-dev
    volumes:
      # Monta la raíz del repo en la ruta estándar de devcontainers.
      - ..:/workspaces/EF_RUST:cached
      # Cache persistente de cargo entre rebuilds.
      - molde-cargo-cache:/usr/local/cargo/registry
    command: sleep infinity
    environment:
      # Cadena de conexión que consume el CLI de molde (formato sqlx).
      DATABASE_URL: postgres://molde:molde@db:5432/molde_dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - molde-net

  db:
    image: postgres:17-bookworm
    container_name: molde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: molde
      POSTGRES_PASSWORD: molde
      POSTGRES_DB: molde_dev
    volumes:
      - molde-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molde -d molde_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - molde-net

volumes:
  molde-pgdata:
  molde-cargo-cache:

networks:
  molde-net:
