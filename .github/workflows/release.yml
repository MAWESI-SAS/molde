name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Create the GitHub Release once, with auto-generated notes. The per-target
  # build jobs then attach their archives to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    name: ${{ matrix.target }}${{ matrix.suffix }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Static musl build with a vendored OpenSSL (native-tls): runs on any
          # Linux and accepts servers with legacy X.509 v1 certificates that
          # rustls rejects.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: -nativetls
            flags: --no-default-features --features tls-native-tls-vendored
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}${{ matrix.suffix }}

      - name: Build
        run: cargo build --release --locked -p molde-cli ${{ matrix.flags }} --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dist="molde-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/molde" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          tar czf "$dist.tar.gz" "$dist"
          echo "ASSET=$dist.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist="molde-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}"
          mkdir "$dist"
          cp "target/${{ matrix.target }}/release/molde.exe" "$dist/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          7z a "$dist.zip" "$dist"
          echo "ASSET=$dist.zip" >> "$GITHUB_ENV"

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
