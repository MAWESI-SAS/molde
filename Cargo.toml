[workspace]
resolver = "2"
members = [
    "crates/molde-cli",
    "crates/molde-core",
    "crates/molde-providers",
    "crates/molde-migrate",
    "crates/molde-scaffold",
    "crates/molde-design",
    "crates/molde-lang",
    "crates/molde-lsp",
    "crates/molde-sync",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Mauricio Arias Melo <mauricio@mawesi.net>"]
repository = "https://github.com/MAWESI-SAS/molde"
homepage = "https://github.com/MAWESI-SAS/molde"
readme = "README.md"
keywords = ["database", "migrations", "schema", "sql", "cli"]
categories = ["database", "command-line-utilities", "development-tools"]

[workspace.dependencies]
# Internal crates
molde-core = { path = "crates/molde-core" }
molde-providers = { path = "crates/molde-providers" }
molde-lang = { path = "crates/molde-lang" }
# default-features=false so the binary (molde-cli) picks sqlx's TLS backend via
# its own features (tls-rustls by default / tls-native-tls).
# Each crate's tests still enable their default when built as a target.
molde-migrate = { path = "crates/molde-migrate", default-features = false }
molde-scaffold = { path = "crates/molde-scaffold", default-features = false }
molde-design = { path = "crates/molde-design" }
molde-sync = { path = "crates/molde-sync", default-features = false }

# External
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# The TLS backend is NOT pinned here: it is chosen by the leaf crates' features
# (tls-rustls by default; tls-native-tls for servers with legacy certificates
# that rustls rejects). See crates/molde-cli/Cargo.toml.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "mysql", "migrate"] }
time = { version = "0.3" }
