[workspace]
resolver = "2"
members = [
    "crates/efrust-cli",
    "crates/efrust-core",
    "crates/efrust-providers",
    "crates/efrust-migrate",
    "crates/efrust-scaffold",
    "crates/efrust-design",
    "crates/efrust-lang",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["mauricio <mauricio@mawesi.net>"]
repository = ""

[workspace.dependencies]
# Internal crates
efrust-core = { path = "crates/efrust-core" }
efrust-providers = { path = "crates/efrust-providers" }
efrust-lang = { path = "crates/efrust-lang" }
# default-features=false para que el binario (efrust-cli) elija el backend TLS
# de sqlx vía sus propias features (tls-rustls por defecto / tls-native-tls).
# Los tests de cada crate igual activan su default al construirse como target.
efrust-migrate = { path = "crates/efrust-migrate", default-features = false }
efrust-scaffold = { path = "crates/efrust-scaffold", default-features = false }
efrust-design = { path = "crates/efrust-design" }

# External
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# El backend TLS NO se fija aquí: lo eligen las features de los crates hoja
# (tls-rustls por defecto; tls-native-tls para servidores con certificados
# legacy que rustls rechaza). Ver crates/efrust-cli/Cargo.toml.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "any", "postgres", "sqlite", "mysql"] }
time = { version = "0.3" }
